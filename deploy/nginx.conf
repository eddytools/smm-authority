# /etc/nginx/sites-available/authority.thegrowthstacker.in  (certbot adds the HTTPS server block and the redirect)
server {
    listen 80;
    listen [::]:80;
    server_name authority.thegrowthstacker.in;

    root /opt/smm/dashboard/dist;
    index index.html;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API lives under /api; the prefix is stripped before it reaches the app (uvicorn --root-path /api keeps links right).
    location /api/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # AI drafting can take a while
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html, which must never be cached for long
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
